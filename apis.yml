aid: appaegis
name: Appaegis
description: >-
  Appaegis (now Mammoth Cyber) is an enterprise zero-trust access and secure
  enterprise browser company. Originally launched as Appaegis, the company
  rebranded to Mammoth Cyber and delivers an Enterprise AI Browser that unifies
  secure web access, data loss prevention, granular access policy, and zero-trust
  controls for remote workforces, BYOD, and third-party contractors. The platform
  is API-first: it exposes a REST management API (v1 and v2) and a GraphQL
  endpoint on api.mammothcyber.net for administering users, teams, access roles,
  policies, applications, networks, registered devices, blocked-site lists, and
  URL categories, with API keys issued from the management portal and a
  token-exchange authentication flow. This profile was seeded as a 500 Global
  portfolio lead and enriched from the company's public developer surface.
