apis:
- name: Mammoth Cyber Management API
  description: >-
    REST (v1 + v2) and GraphQL management API for the Mammoth Cyber (Appaegis)
    zero-trust access platform. Administers users, teams, access roles, policies,
    applications, networks, registered devices, blocked-site lists, and URL
    categories. Authentication is a token exchange: POST apiKey/apiSecret to
    /api/v2/authentication to receive an idToken, then pass it as the idToken
    header (REST) or Authorization: Bearer (GraphQL). API keys are created in the
    management portal under Setting -> Admins & API Keys.
  humanURL: https://github.com/appaegis/api-script-samples
